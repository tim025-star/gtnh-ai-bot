name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - name: Install companion
        working-directory: companion
        run: pnpm install --frozen-lockfile
      - name: Verify companion
        working-directory: companion
        run: pnpm check && pnpm check-types && pnpm test && pnpm build
      - name: Audit production dependencies
        working-directory: companion
        run: pnpm audit --prod
      - name: Verify mod
        run: .\gradlew.bat --no-configuration-cache test build
      - name: Check public tree
        run: node scripts/check-public-tree.mjs
